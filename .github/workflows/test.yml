name: test
on: [
  push,
  pull_request
]
env:
  CI: true
jobs:
  test:
    name: "Test on Node.js ${{ matrix.node-version }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run check
      - name: Test
        run: bun run test
      - name: Package
        run: bun run package

  consumers:
    name: "Consumable from ${{ matrix.package-manager }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package-manager: [npm, yarn, pnpm]
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Build the package
        run: |
          bun install --frozen-lockfile
          bun run package
      - name: Pack, install, and build a consumer app
        run: bun run verify:consumer ${{ matrix.package-manager }}
